const CFG = {
    owner: '', repo: '', branch: 'HEAD', driveKey: '',
    voice: {
        dirs: ['voice', 'озвучка'], drive: ''
    },
    art: {
        dirs: ['art', 'drawings', 'малюнки'], drive: ''
    }
};

const EXT = {
    art: /\.(jpe?g|png|gif|webp|svg|avif)$/i, voice: /\.(mp3|wav|ogg|m4a|flac|aac)$/i
};
const bn = x => {
    const p = x.split(/\||~/).map(v => v.trim());
    return [p[0], p[1] || p[0]];
};

function repoInfo() {
    let o = CFG.owner, r = CFG.repo;
    if (!o) {
        const h = location.hostname;
        if (h.endsWith('.github.io')) {
            o = h.split('.')[0];
            r = location.pathname.split('/')[1] || h;
        }
    }
    return [o, r];
}
let TREE;

function getTree() {
    return TREE || (TREE = (() => {
        const [o, r] = repoInfo();
        return fetch(`https://api.github.com/repos/${o}/${r}/git/trees/${CFG.branch}?recursive=1`).then(x => x.json()).then(j => {
            if (!j.tree)
                throw 0;
            const a = j.tree.filter(e => e.type == 'blob').map(e => e.path);
            try {
                sessionStorage.setItem('tree', JSON.stringify(a));
            }
            catch (e) {
            }
            return a;
        }).catch(e => {
            try {
                const c = sessionStorage.getItem('tree');
                if (c)
                    return JSON.parse(c);
            }
            catch (_) {
            }
            throw e;
        });
    })());
}

function fromPaths(paths, dirs, kind) {
    const top = { kids: [] };
    paths.forEach(p => {
        const s = p.split('/');
        if (s.length < 2 || !dirs.includes(s[0].toLowerCase()))
            return;
        let n = top;
        s.slice(1, -1).forEach(d => {
            let c = n.kids.find(k => k.key == d);
            if (!c)
                n.kids.push(c = {
                    key: d, n: bn(d), kids: []
                });
            n = c;
        });
        const f = s[s.length - 1];
        if (EXT[kind].test(f))
            n.kids.push({
                n: bn(f.replace(/\.[^.]+$/, '')), src: encodeURI(p)
            });
    });
    const so = n => {
        n.kids.sort((x, y) => (!!y.kids - !!x.kids) || x.n[0].localeCompare(y.n[0], undefined, { numeric: true }));
        n.kids.forEach(k => k.kids && so(k));
    };
    so(top);
    return top.kids;
}

async function drive(id, kind) {
    const u = `https://www.googleapis.com/drive/v3/files?pageSize=1000&orderBy=folder,name&fields=files(id,name,mimeType)&key=${CFG.driveKey}&q=${encodeURIComponent(`'${id}' in parents and trashed=false`)}`;
    const j = await (await fetch(u)).json();
    if (!j.files)
        throw 0;
    return j.files.flatMap(f => {
        const n = bn(f.name.replace(/\.[^.]+$/, ''));
        if (f.mimeType == 'application/vnd.google-apps.folder') {
            const o = {
                n: bn(f.name), kids: null
            };
            o.load = async () => {
                o.kids = await drive(f.id, kind);
            };
            return [o];
        }
        if (kind == 'art' && f.mimeType.startsWith('image/'))
            return [{
                    n, src: `https://drive.google.com/thumbnail?id=${f.id}&sz=w1600`
                }];
        if (kind == 'voice' && f.mimeType.startsWith('audio/'))
            return [{
                    n, gid: f.id
                }];
        return [];
    });
}

function root(n, kind) {
    const c = CFG[kind], o = {
        n, kids: null
    };
    o.load = async () => {
        let k = [];
        try {
            k = fromPaths(await getTree(), c.dirs, kind);
        }
        catch (e) {
            if (!(c.drive && CFG.driveKey))
                throw e;
        }
        if (c.drive && CFG.driveKey)
            k = k.concat(await drive(c.drive, kind));
        o.kids = k;
    };
    return o;
}

};

const FN = {
    wav: 'audio', img: 'image', err: 'error'
}, XT = ['png', 'webp', 'svg', 'ico'], OK = {}, MISS = {};

const SV = (k, s) => `<svg class="sv" width="${s}" height="${s}" viewBox="0 0 32 32">${P[k]}</svg>`;

const I = (k, s = 32) => {
    if (MISS[k])
        return SV(k, s);
    const e = OK[k] || 'png';
    return `<img class="sv" alt="" width="${s}" height="${s}" src="icons/${FN[k] || k}.${e}" data-k="${k}" data-e="${XT.indexOf(e)}" data-s="${s}" onload="OK[this.dataset.k]=XT[this.dataset.e]" onerror="icoFail(this)">`;
};

function icoFail(e) {
    const k = e.dataset.k, n = +e.dataset.e + 1;
    if (n < XT.length) {
        e.dataset.e = n;
        e.src = `icons/${FN[k] || k}.${XT[n]}`;
    }
    else {
        MISS[k] = 1;
        e.outerHTML = SV(k, e.dataset.s);
    }
}
const bad = e => e.outerHTML = `<div class="ph">${I('img', 32)}</div>`;
let L = 'en';
try {
    L = localStorage.getItem('lang') || 'en';
}
catch (e) {
}
const t = k => T[L][k].trim().replace(/\n/g, '<br>'), nm = o => o.n[L == 'uk' ? 1 : 0], $ = s => document.querySelector(s), tx = (s, v) => {
    const e = document.querySelector(s);
    if (e)
        e.textContent = v;
};

const W = {};
let z = 10;

function focus(id) {
    Object.values(W).forEach(w => w.btn.classList.remove('on'));
    const w = W[id];
    w.el.style.zIndex = ++z;
    w.btn.classList.add('on');
}

function refresh(id) {
    const w = W[id];
    if (!w)
        return;
    const s = w.title(), b = w.el.querySelector('.tb b'), bd = w.el.querySelector('.body');
    if (b)
        b.textContent = s;
    w.btn.textContent = s;
    if (!w.st && bd)
        w.render(bd);
}

function win(id, ic, title, render, w = 560, h = 400, st) {
    if (W[id]) {
        W[id].el.classList.remove('min');
        focus(id);
        return;
    }
    const n = Object.keys(W).length, el = document.createElement('div');
    el.className = 'win';
    el.style.cssText = `width:${w}px;height:${h}px;left:${40 + n * 26}px;top:${24 + n * 26}px`;
    el.innerHTML = `<div class="tb">${I(ic, 16)}<b></b><button class="mn">_</button><button class="mx">□</button><button class="x">✕</button></div><div class="body"></div>`;
    document.body.appendChild(el);
    const btn = document.createElement('button');
    btn.className = 'task';
    $('#tasks').appendChild(btn);
    W[id] = {
        el, btn, title, render, st
    };
    refresh(id);
    focus(id);
    const tb = el.querySelector('.tb');
    el.onpointerdown = () => focus(id);
    btn.onclick = () => {
        if (el.classList.contains('min') || !btn.classList.contains('on')) {
            el.classList.remove('min');
            focus(id);
        }
        else
            el.classList.add('min'), btn.classList.remove('on');
    };
    el.querySelector('.mn').onclick = () => {
        el.classList.add('min');
        btn.classList.remove('on');
    };
    el.querySelector('.mx').onclick = () => el.classList.toggle('max');
    tb.ondblclick = e => {
        if (e.target.tagName != 'BUTTON')
            el.classList.toggle('max');
    };
    el.querySelector('.x').onclick = () => {
        el.classList.add('cls');
        setTimeout(() => {
            el.remove();
            btn.remove();
            delete W[id];
        }, 140);
    };
    tb.onpointerdown = e => {
        if (e.target.tagName == 'BUTTON' || el.classList.contains('max'))
            return;
        const r = el.getBoundingClientRect(), dx = e.clientX - r.left, dy = e.clientY - r.top;
        tb.setPointerCapture(e.pointerId);
        tb.onpointermove = v => {
            el.style.left = v.clientX - dx + 'px';
            el.style.top = Math.max(0, v.clientY - dy) + 'px';
        };
        tb.onpointerup = () => tb.onpointermove = null;
    };
}

function explorer(id, ic, root, art) {
    let path = [root];
    win(id, ic, () => nm(root), b => {
        const cur = path[path.length - 1];
        if (!cur.kids) {
            b.innerHTML = `<div class="ld">${t('loading')}<div class="pb"><i></i></div></div>`;
            Promise.resolve().then(() => cur.load()).catch(() => {
                cur.err = 1;
                cur.kids = [];
            }).then(() => {
                if (W[id])
                    W[id].render(b);
            });
            return;
        }
        b.innerHTML = `<div class="bar2"><button class="bk">◀ ${t('back')}</button><div class="addr">${I(ic, 14)} ${path.map(nm).join(' › ')}</div></div><div class="ex"><div class="side"><h4>${t('tasks')}</h4>${cur.kids.length} ${t('items')}${DRIVE && !art ? `<a href="${DRIVE}" target="_blank">${t('drive')}</a>` : ''}</div><div class="grid"></div></div><div class="pl"></div>`;
        b.querySelector('.bk').onclick = () => {
            if (path.length > 1) {
                path.pop();
                W[id].render(b);
            }
        };
        const g = b.querySelector('.grid');
        if (!cur.kids.length)
            g.innerHTML = `<div class="ld">${cur.err ? t('fail') : t('empty')}</div>`;
        cur.kids.forEach(f => {
            const d = document.createElement('div');
            d.className = 'it';
            const ico = 'kids' in f ? I('folder', 48) : art ? `<img src="${f.src}" alt="" loading="lazy" onerror="bad(this)">` : I('wav', 48);
            d.innerHTML = `<div class="ico">${ico}</div>${nm(f)}`;
            d.onclick = () => {
                if ('kids' in f) {
                    path.push(f);
                    W[id].render(b);
                }
                else if (art)
                    win('img' + f.src, 'img', () => nm(f), v => v.innerHTML = `<div class="view"><img src="${f.src}" onerror="bad(this)"></div>`, 480, 420);
                else {
                    const p = b.querySelector('.pl');
                    p.style.display = 'block';
                    p.innerHTML = f.gid ? `${nm(f)}<br><iframe src="https://drive.google.com/file/d/${f.gid}/preview" style="width:100%;height:90px;border:0"></iframe>` : `${I('wav', 16)} ${nm(f)}<br><audio controls autoplay src="${f.src}"></audio>`;
                }
            };
            g.appendChild(d);
        });
    }, 620, 420);
}

const APPS = [
    ['art', 'art', () => explorer('art', 'art', ART, 1)],
    ['voice', 'voice', () => explorer('voice', 'voice', VOICE)],
    ['about', 'about', () => win('about', 'about', () => t('about'), b => b.innerHTML = `<div class="txt"><h2>${NAME}</h2>${t('bio')}</div>`, 420, 300)],
    ['contact', 'contact', () => win('contact', 'contact', () => t('contact'), b => b.innerHTML = `<div class="txt"><h2>${t('contact')}</h2>${LINKS.map(l => (l[1] && l[1].trim() && l[1].trim() != '#' ? `<a href="${l[1]}" target="_blank">▸ ${l[0]}</a>` : `<div class="plain">▸ ${l[0]}</div>`)).join('')}</div>`, 340, 260)],
    ['bin', 'bin', () => win('err', 'err', () => 'Error', b => b.innerHTML = `<div class="txt">${I('err', 32)} ${t('binmsg')}<br><br><button class="btn" onclick="this.closest('.win').querySelector('.x').click()">${t('ok')}</button></div>`, 340, 190)]
];

function build() {
    $('#icons').innerHTML = '';
    APPS.forEach(a => {
        const d = document.createElement('div');
        d.className = 'ic';
        d.tabIndex = 0;
        d.innerHTML = `${I(a[1], 40)}${t(a[0])}`;
        d.ondblclick = a[2];
        d.onkeydown = e => e.key == 'Enter' && a[2]();
        d.onclick = e => {
            if (matchMedia('(pointer:coarse)').matches)
                a[2]();
        };
        $('#icons').appendChild(d);
    });
    $('#sm').innerHTML = `<h3>${NAME}</h3>${APPS.slice(0, 4).map((a, i) => `<div data-i="${i}">${I(a[1], 24)}${t(a[0])}</div>`).join('')}<footer><div data-l>${t('lang')}</div><div data-o>${t('off')}</div></footer>`;
    tx('#st', t('start'));
    tx('#lang', L == 'uk' ? 'УКР' : 'EN');
    tx('#bt', t('boot'));
    $('#bal').innerHTML = `<b>${t('balT')}</b>${t('balM')}`;
    document.documentElement.lang = L;
    tick();
}

function setLang(l) {
    L = l;
    try {
        localStorage.setItem('lang', l);
    }
    catch (e) {
    }
    build();
    Object.keys(W).forEach(refresh);
}

function tick() {
    tx('#clk', new Date().toLocaleTimeString(L == 'uk' ? 'uk-UA' : 'en-US', {
        hour: '2-digit', minute: '2-digit'
    }));
}

$('#lang').onclick = () => setLang(L == 'en' ? 'uk' : 'en');

$('#bal').onclick = e => e.currentTarget.style.display = 'none';

$('#st').onclick = e => {
    e.stopPropagation();
    $('#sm').classList.toggle('on');
};
document.onclick = e => $('#sm').classList.remove('on');

$('#sm').onclick = e => {
    const d = e.target.closest('div');
    if (!d)
        return;
    if (d.dataset.i != null)
        APPS[d.dataset.i][2]();
    if ('l' in d.dataset)
        setLang(L == 'en' ? 'uk' : 'en');
    if ('o' in d.dataset) {
        const o = $('#off');
        o.style.display = 'flex';
        o.innerHTML = `<div style="font-size:22px">${t('safe')}</div><small>${t('again')}</small>`;
        o.onclick = () => location.reload();
    }
};

$('#boot').onclick = () => {
    if (window.bd)
        return;
    window.bd = 1;
    $('#boot').style.opacity = 0;
    setTimeout(() => {
        $('#boot').remove();
        APPS[2][2]();
        setTimeout(() => {
            $('#bal').style.display = 'block';
            setTimeout(() => $('#bal').style.display = 'none', 9000);
        }, 900);
    }, 600);
};
setTimeout(() => $('#boot') && $('#boot').click(), 2800);
setInterval(tick, 10000);
build();
</script>
